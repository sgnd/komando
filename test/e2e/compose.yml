# bastion is reachable from the host; target and the data services are only
# reachable through bastion (komando conns use --via bastion).
services:
  bastion:
    build: .
    ports: ["127.0.0.1:${E2E_SSH_BASTION:-2222}:22"]
    networks: [public, private]
  target:
    build: .
    networks: [private]
    hostname: target
  direct:
    build: .
    ports: ["127.0.0.1:${E2E_SSH_DIRECT:-2223}:22"]
    networks: [public]
    hostname: direct
  pg:
    image: postgres:17-alpine  # same major version as the client in Debian 13
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: apppass, POSTGRES_DB: app }
    networks: [private]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "app"], interval: 2s, retries: 30 }
  maria:
    image: mariadb:11.8.9
    environment: { MARIADB_USER: shop, MARIADB_PASSWORD: shoppass, MARIADB_DATABASE: shop, MARIADB_ROOT_PASSWORD: rootpass }
    networks: [private]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect"], interval: 2s, retries: 30 }
  redis:
    image: redis:8.10.3
    command: ["redis-server", "--requirepass", "redispass"]
    networks: [private]
  memcached:
    image: memcached:1.6.39
    entrypoint: ["sh", "-c", "echo e2e:mcpass > /tmp/auth && exec memcached -Y /tmp/auth"]
    networks: [private]
  s3:
    build: garage
    networks: [private]
  registry:
    image: registry:2
    environment: { REGISTRY_STORAGE_DELETE_ENABLED: "true" }
    ports: ["127.0.0.1:${E2E_REGISTRY:-5005}:5000"]  # only to push the test image; komando reaches it through bastion
    networks:
      # an Amazon ECR style name too, so komando's ECR login runs (checks/aws.sh)
      private: { aliases: [123456789012.dkr.ecr.us-east-1.amazonaws.com] }
      public: {}
  regtls:
    build: regtls  # HTTPS with a private CA; the name resolves only on the private network
    networks:
      private: { aliases: [registry.lab.test] }
  swarm:
    build: swarm
    privileged: true
    ports: ["127.0.0.1:${E2E_SSH_SWARM:-2224}:22"]
    networks: [public]
  k3s:
    image: rancher/k3s:v1.33.5-k3s1
    command: ["server", "--tls-san", "k3s", "--disable", "traefik", "--disable", "metrics-server", "--disable", "servicelb"]
    privileged: true
    tmpfs: ["/run", "/var/run"]
    networks: [private, public]  # k3s needs a default route; no port is published, so it is still reached through bastion
  # Kubernetes 1.29: no WebSocket exec yet, so komando streams over SPDY there
  k3s-old:
    image: rancher/k3s:v1.29.15-k3s1
    command: ["server", "--tls-san", "k3s-old", "--tls-san", "127.0.0.1", "--disable", "traefik", "--disable", "metrics-server", "--disable", "servicelb", "--disable", "coredns", "--disable", "local-storage"]
    privileged: true
    tmpfs: ["/run", "/var/run"]
    ports: ["127.0.0.1:${E2E_K3S_OLD:-16444}:6443"]  # for the SPDY Go test; komando itself goes through bastion
    networks: [private, public]
  sftp:
    image: atmoz/sftp:alpine
    command: ["deploy:deploypass:::uploads"]
    networks: [private]
  ftps:
    build: ftps
    networks: [private]
  # cloud storage emulators (gcs, azblob and webdav conns)
  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    entrypoint: ["sh", "-c", "mkdir -p /data/media && exec /bin/fake-gcs-server -data /data -scheme http -port 4443 -public-host gcs:4443"]
    networks: [private]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--loose"]
    ports: ["127.0.0.1:${E2E_AZURITE:-10010}:10000"]  # the container is made from the host
    networks: [public, private]
  webdav:
    image: rclone/rclone:1.68.2
    command: ["serve", "webdav", "/data", "--addr", ":8080", "--user", "deploy", "--pass", "deploypass"]
    networks: [private]
  # an SMB share (smb conns) that requires signing and SMB 3 encryption;
  # the image has no version tags (latest is its 2021 build)
  samba:
    image: dperson/samba:latest
    command: ["-p", "-u", "deploy;deploypass", "-s", "files;/files;no;no;no;deploy", "-g", "server signing = mandatory", "-g", "smb encrypt = required"]
    networks: [private]
  mongo:
    # 7.0: MongoDB 8.0 and later do not start on Linux 6.19 and newer, the
    # CI runners' kernel (SERVER-121912, a TCMalloc bug)
    image: mongo:7.0.45
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]  # the lab is crowded; a small cache is enough
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: mongopass }
    # The image creates the root user with a temporary mongod, stops it and
    # starts the real one. Now and then the real one finds port 27017 still
    # taken and exits with code 48. The restart keeps /data/db, so the
    # entrypoint skips the temporary mongod and the port is free.
    restart: on-failure:3
    networks: [private]
  kafka:
    # one KRaft node that advertises the name the bastion resolves, so
    # komando reaches every broker --via bastion (checks/kafka.sh)
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m  # the lab is crowded
    networks: [private]
  rabbitmq:
    # RabbitMQ with the management API, reached --via bastion
    # (checks/rabbitmq.sh)
    image: rabbitmq:4.1.8-management
    environment: { RABBITMQ_DEFAULT_USER: app, RABBITMQ_DEFAULT_PASS: rabbitpass }
    networks: [private]
  nats:
    # NATS with JetStream, reached --via bastion (checks/nats.sh)
    image: nats:2.12.1-alpine
    command: ["-js", "-m", "8222", "--user", "app", "--pass", "natspass"]
    networks: [private]
  pubsub:
    # the Google Cloud Pub/Sub emulator, reached --via bastion (checks/pubsub.sh)
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8085", "--project=test-project"]
  mssql:
    # SQL Server images are amd64 only. An arm64 machine needs Rosetta
    # (Docker Desktop, or colima start --vz-rosetta); under QEMU sqlservr
    # does not start. There, E2E_MSSQL_IMAGE=mcr.microsoft.com/azure-sql-edge:latest
    # and E2E_MSSQL_PLATFORM=linux/arm64 run the arm64 build of the same engine.
    image: ${E2E_MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04}
    platform: ${E2E_MSSQL_PLATFORM:-linux/amd64}
    environment: { ACCEPT_EULA: "Y", MSSQL_PID: Developer, MSSQL_SA_PASSWORD: "Sales-pass-1", MSSQL_MEMORY_LIMIT_MB: "2048" }
    networks: [private]
  oracle:
    # Oracle Database Free (gvenzl's image has amd64 and arm64 builds); it
    # needs about 2 GB of memory and a minute or two to open FREEPDB1
    image: ${E2E_ORACLE_IMAGE:-gvenzl/oracle-free:23-slim}
    environment: { ORACLE_PASSWORD: "Oracle-pass-1" }
    networks: [private]
  clickhouse:
    # komando speaks ClickHouse's HTTP interface (8123); the user may
    # manage users with SQL (access management)
    image: ${E2E_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    environment: { CLICKHOUSE_USER: admin, CLICKHOUSE_PASSWORD: "Admin-pass-1", CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    networks: [private]
  snowflake:
    # no Snowflake account or free emulator runs here: komando's own fake
    # of the SQL API (test/e2e/snowflake), with a private CA and a key pair
    build: snowflake
    networks:
      private: { aliases: [e2e-acct.snowflakecomputing.com] }
  # secret managers komando talks to itself (no vault or aws CLI)
  bao:
    image: openbao/openbao:2.4.3
    command: ["server", "-dev", "-dev-root-token-id=e2e-root", "-dev-listen-address=0.0.0.0:8200"]
    ports: ["127.0.0.1:${E2E_BAO:-8201}:8200"]
    networks: [public]
  moto:
    image: motoserver/moto:5.1.16
    ports: ["127.0.0.1:${E2E_MOTO:-5016}:5000"]
    networks: [public]
  vaultwarden:
    image: vaultwarden/server:1.34.3
    environment: { SIGNUPS_ALLOWED: "true", I_REALLY_WANT_VOLATILE_STORAGE: "true", DOMAIN: "http://127.0.0.1" }
    ports: ["127.0.0.1:${E2E_VW:-8090}:80"]
    networks: [public]
networks:
  public: {}
  private: { internal: true }
