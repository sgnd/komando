# Checks that run on GitHub after every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on GitHub
  workflow_call: # release.yml runs these checks before every release

# least privilege: CI only reads the code (OpenSSF Scorecard: Token-Permissions)
permissions:
  contents: read

jobs:
  # Formatting, go vet, staticcheck, unit tests, and a build.
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions are pinned to a commit, not a tag that can move (Pinned-Dependencies)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make cover # unit tests + coverage floors
      - run: make build

  # Every system and processor komando is released for: go vet (which
  # type-checks the tests too), the tests compiled, and a build. Pure Go
  # (CGO_ENABLED=0), so one Linux runner checks them all.
  cross:
    name: Build and vet (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/komando
      - run: for p in $(go list ./...); do go test -c -o /dev/null "$p" || exit 1; done

  # Windows: komando builds there natively and runs, and every unit test
  # runs; a test that needs Unix (a POSIX shell, file modes) says so when it
  # skips. The console tests use a Windows pseudo console (ConPTY).
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # the tests compare files byte for byte: keep the LF line ends Git
      # stores (a Windows runner checks text out with CRLF by default)
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o komando.exe ./cmd/komando
      - run: ./komando.exe --version
      # KOMANDO_KEYCHAIN=off: test vaults keep their key in a file, as on
      # the Linux runner, not in the runner's Credential Manager
      - run: go test -timeout 30m ./...
        env:
          KOMANDO_KEYCHAIN: "off"

  # Known vulnerabilities in the code and its modules (govulncheck).
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make security

  # Real SSH, databases, caches and storage in Docker: each area of the lab
  # (test/e2e/run.sh --list) on a runner of its own, at the same time.
  e2e-areas:
    name: End-to-end areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.list.outputs.areas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "areas=$(test/e2e/run.sh --list-json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end tests (${{ matrix.area }})
    needs: e2e-areas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.e2e-areas.outputs.areas) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make e2e AREA=${{ matrix.area }}

  # One check named "End-to-end tests" (the name the "Protect main" ruleset
  # requires): green only when the area list and every area passed. A
  # failed, cancelled or skipped area makes it fail.
  e2e-all:
    name: End-to-end tests
    needs: [e2e-areas, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          AREAS: ${{ needs.e2e-areas.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "area list: $AREAS, areas: $E2E"
          [ "$AREAS" = success ] && [ "$E2E" = success ]
