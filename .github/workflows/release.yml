# Every version is a GitHub release: push a tag like v0.4.0, and this runs every check,
# then publishes the binaries. install.sh downloads the newest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # 1. The same checks as every push (lint, unit, security, e2e): nothing untested reaches the users.
  test:
    uses: ./.github/workflows/ci.yml

  # 2. The release, with an archive per platform, checksums.txt and signed build provenance.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance (Sigstore)
      attestations: write # store it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Write the release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md | sed '/./,$!d' >notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section ## [$v]"; exit 1; }
          cat >>notes.md <<'EOF'

          Install or update:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/sgnd/komando/main/install.sh | sh
          ```

          Check a download: `gh attestation verify FILE --repo sgnd/komando`
          EOF
      - run: make dist VERSION=${{ github.ref_name }}
      # SLSA build provenance: anyone can check a download came from this
      # workflow with `gh attestation verify FILE --repo sgnd/komando`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "komando ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
