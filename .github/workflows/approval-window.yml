# Screenshots of the approval window on macOS and Windows, to compare a
# change before and after. Runs on a pull request that touches the window,
# or by hand ("Run workflow", on any branch).
name: Approval window

on:
  pull_request:
    paths:
      - "internal/cli/approval*.go"
      - ".github/workflows/approval-window.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shot:
    name: Approval window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # a hosted runner may have no screen session: a failed shot never fails the PR
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      KOMANDO_WINDOW_SHOT: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -c -o shot.test ./internal/cli
      # before: main's old AppleScript dialog (internal/cli/approval.go,
      # askOnScreen), with the same sample text and 10 s instead of 120
      - name: Before, the old dialog (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          KOMANDO_SHOT_TEXT: ${{ runner.temp }}/shot.txt
        run: |
          ./shot.test -test.run '^TestApprovalWindowShotText$' -test.v
          osascript -e 'on run argv
          set r to display dialog (item 1 of argv) with title "komando: allow?" buttons {"Deny", "Allow once"} default button "Deny" cancel button "Deny" giving up after 10 with icon caution
          if gave up of r then return "gave up"
          return button returned of r
          end run' "$(cat "$KOMANDO_SHOT_TEXT")" &
          sleep 5
          screencapture -x before-macos.png
          wait || true
      - name: After, the new window (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./shot.test -test.run '^TestApprovalWindowShot$' -test.v &
          sleep 5
          screencapture -x after-macos.png
          wait
      - name: After, the new window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\shot.test -ArgumentList '-test.run','^TestApprovalWindowShot$','-test.v' -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\after-windows.png")
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: approval-window-${{ runner.os }}
          path: |
            before-macos.png
            after-macos.png
            after-windows.png
          if-no-files-found: warn
      - name: Note in the job summary
        if: failure()
        shell: bash
        run: echo "The window could not be shown or captured on this runner (no screen session?). This job does not fail the pull request." >> "$GITHUB_STEP_SUMMARY"
