# Opens a pull request when a Go module or a GitHub Action used in .github/workflows
# has a new version. Updates are grouped: at most one pull request per ecosystem a month.
# Security fixes come right away, not once a month.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
