# Screenshots of the approval window on macOS and Windows, one per case
# (shotCases in internal/cli/approval_shot_test.go), to compare a change
# before and after: run it by hand with prefix "before" on the old code and
# "after" on the new. Also runs on a pull request that touches the window.
# On macOS it also presses keys in the open panel (C238) for two cases.
name: Approval window

on:
  pull_request:
    paths:
      - "internal/cli/approval*.go"
      - ".github/workflows/approval-window.yml"
  workflow_dispatch:
    inputs:
      prefix:
        description: "PNG name prefix: before (old window) or after (new window)"
        type: choice
        options: [after, before]
        default: after

permissions:
  contents: read

jobs:
  shot:
    name: Approval window (${{ matrix.os }}, ${{ matrix.case }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # keep in step with shotCases
        case: [short, script, sudo, hosts, destructive, db-query, indonesian, long-lines, tall-script]
        mode: [light, dark]
        exclude:
          - os: windows-latest
            mode: dark
    env:
      KOMANDO_WINDOW_SHOT: "1"
      KOMANDO_SHOT_CASE: ${{ matrix.case }}
      # a pull request has no inputs: its shots are "after"
      SHOT_PNG: ${{ inputs.prefix || 'after' }}-${{ matrix.case }}-${{ matrix.mode }}.png
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -c -o shot.test ./internal/cli
      # macOS: winid.js lists the on-screen windows (owner, name, id, bounds)
      # and prints the id of the largest one owned by osascript or komando
      # ("bounds": its X Y W H in screen points, top-left origin);
      # shot.sh captures that window, or fails after 10 s with the list.
      - name: Window finder (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/winid.js" <<'JS'
          ObjC.import('CoreGraphics');
          function run(argv) {
            var list = ObjC.deepUnwrap(ObjC.castRefToObject($.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly, $.kCGNullWindowID))) || [];
            if (argv[0] === 'list') {
              return list.map(function (w) {
                var b = w.kCGWindowBounds || {};
                return [w.kCGWindowOwnerName, w.kCGWindowName || '', w.kCGWindowNumber, b.X + ',' + b.Y + ' ' + b.Width + 'x' + b.Height].join(' | ');
              }).join('\n');
            }
            var best = null;
            list.forEach(function (w) {
              var b = w.kCGWindowBounds || {};
              if ((w.kCGWindowOwnerName === 'osascript' || w.kCGWindowOwnerName === 'komando') && b.Height > 60 && (!best || b.Height * b.Width > best.a)) best = { id: w.kCGWindowNumber, a: b.Height * b.Width, b: b };
            });
            if (best && argv[0] === 'bounds') return [best.b.X, best.b.Y, best.b.Width, best.b.Height].map(Math.round).join(' ');
            return best ? String(best.id) : '';
          }
          JS
          # asgui runs a command in the logged-in user's GUI session, as
          # that user, with the gate's variables (sudo drops the environment)
          cat > "$RUNNER_TEMP/asgui.sh" <<'SH'
          exec sudo launchctl asuser "$(id -u)" sudo -u "$(id -un)" env CI=true KOMANDO_WINDOW_SHOT=1 RUNNER_OS=macOS HOME="$HOME" PATH="$PATH" "$@"
          SH
          # shot.sh FILE: while the window is up, log the on-screen windows
          # every 0.5 s and capture the osascript or komando one into FILE;
          # fail after 10 s without one. All in the GUI session.
          cat > "$RUNNER_TEMP/shot.sh" <<'SH'
          gui="$RUNNER_TEMP/asgui.sh"
          for i in $(seq 20); do
            echo "on-screen windows, try $i (owner | name | id | bounds):"
            bash "$gui" osascript -l JavaScript "$RUNNER_TEMP/winid.js" list
            id=$(bash "$gui" osascript -l JavaScript "$RUNNER_TEMP/winid.js" find 2>/dev/null)
            if [ -n "$id" ]; then
              sleep 1
              bash "$gui" screencapture -x -o -l "$id" "$PWD/$1" && exit 0
              echo "screencapture -l $id failed" >&2
              exit 1
            fi
            sleep 0.5
          done
          echo "no window owned by osascript or komando within 10 s" >&2
          exit 1
          SH
      # System Events switches the running session (a defaults write alone
      # does not reach it); the step fails when dark was asked but is not on
      - name: Appearance (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dark=false; [ "${{ matrix.mode }}" = dark ] && dark=true
          bash "$RUNNER_TEMP/asgui.sh" osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark"
          style=$(bash "$RUNNER_TEMP/asgui.sh" defaults read -g AppleInterfaceStyle 2>/dev/null || true)
          echo "AppleInterfaceStyle: ${style:-(none, light)}"
          if [ "$dark" = true ] && [ "$style" != Dark ]; then echo "dark mode was asked but is not on" >&2; exit 1; fi
          if [ "$dark" = false ] && [ -n "$style" ]; then echo "light mode was asked but $style is on" >&2; exit 1; fi
      - name: The window (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash "$RUNNER_TEMP/asgui.sh" KOMANDO_SHOT_CASE="$KOMANDO_SHOT_CASE" ./shot.test -test.run '^TestApprovalWindowShot$' -test.v >"$RUNNER_TEMP/after.out" 2>&1 &
          pid=$!
          shot=0
          bash "$RUNNER_TEMP/shot.sh" "$SHOT_PNG" || shot=$?
          code=0; wait "$pid" || code=$?
          echo "helper exit $code, output (osascript's exit and stderr included):"; cat "$RUNNER_TEMP/after.out"
          [ "$shot" = 0 ] && [ "$code" = 0 ]
      # A script that scrolls must open at its first line: OCR (Vision) the
      # screenshot and fail when line 1's mark is not in it
      - name: Line 1 shows at open (macOS)
        if: runner.os == 'macOS' && (matrix.case == 'long-lines' || matrix.case == 'tall-script')
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ocr.swift" <<'SWIFT'
          import AppKit
          import Vision
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let img = NSImage(contentsOf: url), let src = img.cgImage(forProposedRect: nil, context: nil, hints: nil) else { exit(2) }
          // read a 3x copy: small monospace text at 1x is misread now and then
          let w = src.width * 3, h = src.height * 3
          guard let ctx = CGContext(data: nil, width: w, height: h, bitsPerComponent: 8, bytesPerRow: 0,
                                    space: CGColorSpaceCreateDeviceRGB(), bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue) else { exit(2) }
          ctx.interpolationQuality = .high
          ctx.draw(src, in: CGRect(x: 0, y: 0, width: w, height: h))
          guard let cg = ctx.makeImage() else { exit(2) }
          let req = VNRecognizeTextRequest()
          req.recognitionLevel = .accurate
          req.usesLanguageCorrection = false
          req.customWords = ["LINEONEMARK"]
          try VNImageRequestHandler(cgImage: cg).perform([req])
          for o in req.results ?? [] { for t in o.topCandidates(3) { print(t.string) } }
          SWIFT
          swift "$RUNNER_TEMP/ocr.swift" "$SHOT_PNG" > "$RUNNER_TEMP/ocr.txt"
          cat "$RUNNER_TEMP/ocr.txt"
          if ! grep -q LINEONEMARK "$RUNNER_TEMP/ocr.txt"; then echo "script line 1 (LINEONEMARK) is not in the window at open" >&2; exit 1; fi
      # C238: run each key sequence in a fresh panel, a debug run
      # (KOMANDO_APPROVAL_DEBUG, TestApprovalWindowKey). keys.swift posts
      # keys and clicks as HID events, which needs the runner's
      # Accessibility (PostEvent) trust; without it the step fails and says
      # so. No step clicks before a key unless it says so. A run counts only
      # when the debug log shows the panel non-activating, the key window,
      # and its last key ("key NAME"). Then, by what the run must show:
      #   stays: open until komando stops it at 15 s;
      #   scroll: stays, and the script's top edge moved ("scrolled to y=N", N > 0);
      #   focus: stays, and Tab moved the focus away from where it was at open;
      #   deny: Deny with exit 0 (Return, Esc, and Space while Deny has the focus);
      #   bg, field: a click on the background, or on the title (a selectable
      #     text field, which takes the keys: "script area lost focus"), then a
      #     click on the script and Down: the script has the keys again and scrolls;
      #   allow: End, Tab, Tab, Space reach Allow once ("end: Allow once");
      #   gate: Tab, Tab, Space before the end skip Allow once and scroll.
      # Clicks land at points of the panel's bounds: the background in its
      # bottom-left corner, the title 56 pt below its top (the title bar and
      # 20 pt), the script at its middle. The step prints each run's log and
      # osascript's stderr; keys-out keeps them, the exit codes and a
      # screenshot after the last step (the focus ring shows on it).
      - name: Keys in the panel (macOS)
        if: "!cancelled() && runner.os == 'macOS' && matrix.mode == 'light' && (matrix.case == 'short' || matrix.case == 'tall-script')"
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/keys.swift" <<'SWIFT'
          import ApplicationServices
          import Foundation
          // keys check: exit 3 unless this process may post keys
          // keys press CODE MOD: one key down and up; MOD is shift or -
          // keys click X Y: one left click at screen point X Y (top-left origin)
          let a = CommandLine.arguments
          let post = CGPreflightPostEventAccess()
          print("CGPreflightPostEventAccess=\(post) AXIsProcessTrusted=\(AXIsProcessTrusted())")
          if a.count == 2 && a[1] == "check" { exit(post ? 0 : 3) }
          let src = CGEventSource(stateID: .hidSystemState)
          if a.count == 4, a[1] == "click", let x = Double(a[2]), let y = Double(a[3]) {
            let at = CGPoint(x: x, y: y)
            for type in [CGEventType.leftMouseDown, .leftMouseUp] {
              guard let e = CGEvent(mouseEventSource: src, mouseType: type, mouseCursorPosition: at, mouseButton: .left) else { exit(2) }
              e.post(tap: .cghidEventTap)
              usleep(50_000)
            }
            exit(0)
          }
          guard a.count == 4, a[1] == "press", let code = CGKeyCode(a[2]) else { exit(2) }
          for down in [true, false] {
            guard let e = CGEvent(keyboardEventSource: src, virtualKey: code, keyDown: down) else { exit(2) }
            // set every time: a source of the HID state keeps Shift from an earlier key
            e.flags = a[3] == "shift" ? CGEventFlags.maskShift : CGEventFlags()
            e.post(tap: .cghidEventTap)
            usleep(30_000)
          }
          SWIFT
          swiftc -O -o "$RUNNER_TEMP/keys" "$RUNNER_TEMP/keys.swift"
          gui="$RUNNER_TEMP/asgui.sh"
          trust=0; bash "$gui" "$RUNNER_TEMP/keys" check </dev/null || trust=$?
          if [ "$trust" != 0 ]; then
            echo "::error::This runner does not trust its processes to post keys (Accessibility, PostEvent; check exit $trust). No key was pressed, so this run proves nothing about the panel's keys."
            echo "Keys (${KOMANDO_SHOT_CASE}): no key pressed, the runner lacks Accessibility (PostEvent) trust." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          out="$PWD/keys-out"; mkdir -p "$out"
          # name, steps (kCODE a key, kCODEs with Shift, c:bg c:title c:script a click),
          # what the run must show, the debug-log name of its last key
          keys=("tab k48 focus Tab" "shift-tab k48s focus Tab" "up k126 stays Up" "right k124 stays Right" "left k123 stays Left"
            "return k36 deny Return" "esc k53 deny Esc")
          if [ "$KOMANDO_SHOT_CASE" = tall-script ]; then
            # allow runs last: its owner check may leave a system prompt up
            keys+=("down k125 scroll Down" "page-down k121 scroll PageDown" "end k119 scroll End" "space k49 scroll Space"
              "click-bg c:bg,c:script,k125 bg Down" "click-title c:title,c:script,k125 field Down"
              "gate k48,k48,k49 gate Space" "allow k119,k48,k48,k49 allow Space")
          else
            # nothing scrolls: the keys reach the panel, and Deny has the focus, so Space presses it
            keys+=("down k125 stays Down" "page-down k121 stays PageDown" "end k119 stays End" "space k49 deny Space")
          fi
          {
            echo "### Keys in the panel (${KOMANDO_SHOT_CASE})"
            echo "| run | steps | reached the panel | osascript | exit | verdict |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for k in "${keys[@]}"; do
            read -r name steps want logname <<< "$k"
            f="$out/$KOMANDO_SHOT_CASE-$name"
            bash "$gui" KOMANDO_APPROVAL_DEBUG=1 KOMANDO_SHOT_CASE="$KOMANDO_SHOT_CASE" KOMANDO_KEY="$name" KOMANDO_KEY_OUT="$out" \
              ./shot.test -test.run '^TestApprovalWindowKey$' -test.v </dev/null >"$f.test.out" 2>&1 &
            pid=$!
            id=""
            for _ in $(seq 20); do
              id=$(bash "$gui" osascript -l JavaScript "$RUNNER_TEMP/winid.js" find </dev/null 2>/dev/null || true)
              [ -n "$id" ] && break
              sleep 0.5
            done
            if [ -n "$id" ]; then
              sleep 1
              read -r bx by bw bh <<< "$(bash "$gui" osascript -l JavaScript "$RUNNER_TEMP/winid.js" bounds </dev/null 2>/dev/null || true)"
              echo "$name: panel at $bx,$by size ${bw}x$bh"
              for st in ${steps//,/ }; do
                case "$st" in
                  c:bg) bash "$gui" "$RUNNER_TEMP/keys" click $((bx + 10)) $((by + bh - 10)) </dev/null ;;
                  c:title) bash "$gui" "$RUNNER_TEMP/keys" click $((bx + 60)) $((by + 56)) </dev/null ;;
                  c:script) bash "$gui" "$RUNNER_TEMP/keys" click $((bx + bw / 2)) $((by + bh / 2)) </dev/null ;;
                  k*s) bash "$gui" "$RUNNER_TEMP/keys" press "${st:1:${#st}-2}" shift </dev/null ;;
                  k*) bash "$gui" "$RUNNER_TEMP/keys" press "${st:1}" - </dev/null ;;
                esac || echo "step $st exit $?"
                sleep 0.5
              done
              sleep 1
              id=$(bash "$gui" osascript -l JavaScript "$RUNNER_TEMP/winid.js" find </dev/null 2>/dev/null || true)
              if [ -n "$id" ]; then bash "$gui" screencapture -x -o -l "$id" "$f.png" </dev/null || echo "screencapture failed"; fi
              found=yes
            else
              found=no
            fi
            wait "$pid" || true
            reached=no; ended="no log"; exitc="?"; why="no end note: the script chose nothing"
            if [ -s "$f.log" ]; then
              grep -Eq "^js \+[0-9]+ (.* )?key $logname " "$f.log" && reached=yes
              ended=$(sed -n 's/^osascript: //p' "$f.log")
              exitc=$(cat "$f.exit" 2>/dev/null || echo "?")
              note=$(grep -Eo '(end: |error: the modal loop threw)[^|]*' "$f.log" | head -1 | sed 's/ *$//' || true)
              [ -n "$note" ] && why=$note
            fi
            stayed=no; grep -q '(komando stops it at ' "$f.log" 2>/dev/null && stayed=yes
            # the script's top edge after the last scroll, and the focus at open and after the last Tab;
            # "|| true": the step runs with -e and pipefail, and a run may have none of them
            y=$(grep -Eo 'scrolled to y=[0-9]+' "$f.log" 2>/dev/null | tail -1 | sed 's/.*=//' || true)
            f0=$(grep -E '^js \+[0-9]+ shown ' "$f.log" 2>/dev/null | sed -n 's/.* focus \([a-z]*\)$/\1/p' || true)
            f1=$(grep -E '^js \+[0-9]+ focus moved ' "$f.log" 2>/dev/null | tail -1 | sed -n 's/.* focus \([a-z]*\)$/\1/p' || true)
            # each kind's evidence, in the log's order
            order() { awk -v a="$1" -v b="$2" 'index($0, a) && !i { i = NR } index($0, b) && i && !j { j = NR } END { exit !(i && j) }' "$f.log"; }
            if [ "$found" = no ]; then verdict="FAIL: no panel on screen within 10 s"
            elif [ ! -s "$f.log" ]; then verdict="FAIL: the test wrote no log"
            elif ! grep -Eq '^js \+[0-9]+ shown .*nonactivating=true' "$f.log"; then verdict="FAIL: the panel is not non-activating"
            elif ! grep -q 'panel is key' "$f.log"; then verdict="FAIL: the panel never became the key window"
            elif [ "$reached" = no ]; then verdict="FAIL: the last key never reached the panel"
            else
              case "$want" in
                stays) [ "$stayed" = yes ] && verdict="ok: stayed open" || verdict="FAIL: the panel closed on this key ($why)" ;;
                scroll)
                  if [ "$stayed" != yes ]; then verdict="FAIL: the panel closed ($why)"
                  elif [ "${y:-0}" -gt 0 ]; then verdict="ok: scrolled to y=$y with no click"
                  else verdict="FAIL: the script did not scroll (y=${y:-none})"; fi ;;
                focus)
                  if [ "$stayed" != yes ]; then verdict="FAIL: the panel closed ($why)"
                  elif [ -n "$f1" ] && [ "$f1" != "$f0" ]; then verdict="ok: focus $f0 -> $f1"
                  else verdict="FAIL: the focus did not move (open: ${f0:-none}, after: ${f1:-none})"; fi ;;
                deny)
                  if [ "$exitc" = 0 ] && grep -qx 'stdout: "Deny"' "$f.log"; then verdict="ok: Deny, as designed"
                  else verdict="FAIL: did not end as Deny with exit 0 ($why)"; fi ;;
                bg)
                  if [ "$stayed" != yes ]; then verdict="FAIL: the panel closed ($why)"
                  elif ! order 'click: panel background' 'click: script area'; then verdict="FAIL: the clicks did not land on the background, then the script"
                  elif [ "${y:-0}" -gt 0 ]; then verdict="ok: background, script, Down scrolled to y=$y"
                  else verdict="FAIL: Down after the clicks did not scroll (y=${y:-none})"; fi ;;
                field)
                  if [ "$stayed" != yes ]; then verdict="FAIL: the panel closed ($why)"
                  elif ! order 'script area lost focus' 'click: script area'; then verdict="FAIL: the title did not take the keys before the click on the script"
                  elif [ "${y:-0}" -gt 0 ]; then verdict="ok: title, script, Down scrolled to y=$y"
                  else verdict="FAIL: Down after the clicks did not scroll (y=${y:-none})"; fi ;;
                allow)
                  if grep -q 'end: Allow once, key Space' "$f.log"; then verdict="ok: End, Tab, Tab, Space reached Allow once"
                  else verdict="FAIL: the keys did not reach Allow once ($why)"; fi ;;
                gate)
                  if grep -q 'end: Allow once' "$f.log"; then verdict="FAIL: Allow once worked before the end"
                  elif [ "$stayed" = yes ] && [ "${y:-0}" -gt 0 ] && [ "$f1" = script ]; then verdict="ok: Tab skipped Allow once, Space scrolled to y=$y"
                  else verdict="FAIL: want the focus back on the script and a scroll (focus ${f1:-none}, y=${y:-none}, $why)"; fi ;;
              esac
            fi
            case "$verdict" in FAIL*) bad=1 ;; esac
            echo "::group::$name: $verdict"
            echo "debug log:"; cat "$f.log" 2>/dev/null || echo "(none)"
            echo "osascript stderr, raw:"; cat "$f.stderr" 2>/dev/null || echo "(none)"
            echo "test output:"; cat "$f.test.out"
            echo "::endgroup::"
            echo "$name: $verdict (osascript: $ended)"
            echo "| $name | $steps | $reached | $ended | $exitc | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$bad" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled() && runner.os == 'macOS' && matrix.mode == 'light' && (matrix.case == 'short' || matrix.case == 'tall-script')"
        with:
          name: approval-keys-${{ inputs.prefix || 'after' }}-${{ matrix.case }}
          path: keys-out
          if-no-files-found: warn
      # Windows: the window by its class (komandoApproval, an EnumWindows walk), brought to the
      # front, and only its rectangle captured; fails when it is not there
      - name: The window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public struct RECT { public int Left, Top, Right, Bottom; }
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            // the visible top-level window of class cls (FindWindow from
            // PowerShell gets "" for a $null title and finds nothing)
            public static IntPtr Find(string cls) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => {
                var c = new System.Text.StringBuilder(256);
                GetClassName(h, c, 256);
                if (IsWindowVisible(h) && c.ToString() == cls) { found = h; return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }
            public static string Visible() {
              var b = new System.Text.StringBuilder();
              EnumWindows((h, l) => {
                if (IsWindowVisible(h)) {
                  var t = new System.Text.StringBuilder(256); var c = new System.Text.StringBuilder(256);
                  GetWindowText(h, t, 256); GetClassName(h, c, 256);
                  b.AppendLine(t + " | " + c);
                }
                return true;
              }, IntPtr.Zero);
              return b.ToString();
            }
          }
          "@
          $p = Start-Process -FilePath .\shot.test -ArgumentList '-test.run','^TestApprovalWindowShot$','-test.v' -PassThru -NoNewWindow
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 20 -and $h -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Milliseconds 500
            $h = [W]::Find("komandoApproval")
          }
          if ($h -eq [IntPtr]::Zero) {
            Write-Output "no approval window within 10 s; visible top-level windows (title | class):"
            Write-Output ([W]::Visible())
            $p.WaitForExit()
            Write-Output "helper exit $($p.ExitCode)"
            exit 1
          }
          [W]::SetForegroundWindow($h) | Out-Null
          Start-Sleep -Seconds 1
          $r = New-Object RECT
          [W]::GetWindowRect($h, [ref]$r) | Out-Null
          $bmp = New-Object System.Drawing.Bitmap ($r.Right - $r.Left), ($r.Bottom - $r.Top)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\$env:SHOT_PNG")
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: approval-window-${{ runner.os }}-${{ inputs.prefix || 'after' }}-${{ matrix.case }}-${{ matrix.mode }}
          path: ${{ env.SHOT_PNG }}
          if-no-files-found: warn
      - name: Note in the job summary
        if: failure()
        shell: bash
        run: echo "A step failed on this runner (the window, its capture, or the keys). See that step's log." >> "$GITHUB_STEP_SUMMARY"
