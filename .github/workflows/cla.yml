# Asks every outside contributor to sign the Contributor License Agreement
# (CLA.md) once, by writing a comment on their pull request. Signatures are
# stored in signatures/cla.json on the cla-signatures branch.
name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target runs with this repository's token so the bot can
  # comment and record signatures. It never checks out the pull request's
  # code, so that code cannot run here.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA signed
    permissions:
      actions: write
      contents: write # write signatures/cla.json on the cla-signatures branch
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # pinned to a commit, not a tag that can move (Pinned-Dependencies)
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/sgnd/komando/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: sgnd,dependabot[bot]
