# bastion is reachable from the host; target and the data services are only
# reachable through bastion (komando conns use --via bastion).
services:
  bastion:
    build: .
    ports: ["127.0.0.1:${E2E_SSH_BASTION:-2222}:22"]
    networks: [public, private]
  target:
    build: .
    networks: [private]
    hostname: target
  direct:
    build: .
    ports: ["127.0.0.1:${E2E_SSH_DIRECT:-2223}:22"]
    networks: [public]
    hostname: direct
  pg:
    image: postgres:17-alpine  # same major version as the client in Debian 13
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: apppass, POSTGRES_DB: app }
    networks: [private]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "app"], interval: 2s, retries: 30 }
  maria:
    image: mariadb:11.8.9
    environment: { MARIADB_USER: shop, MARIADB_PASSWORD: shoppass, MARIADB_DATABASE: shop, MARIADB_ROOT_PASSWORD: rootpass }
    networks: [private]
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect"], interval: 2s, retries: 30 }
  redis:
    image: redis:8.10.3
    command: ["redis-server", "--requirepass", "redispass"]
    networks: [private]
  s3:
    build: garage
    networks: [private]
  registry:
    image: registry:2
    environment: { REGISTRY_STORAGE_DELETE_ENABLED: "true" }
    ports: ["127.0.0.1:${E2E_REGISTRY:-5005}:5000"]  # only to push the test image; komando reaches it through bastion
    networks:
      # an Amazon ECR style name too, so komando's ECR login runs (checks/aws.sh)
      private: { aliases: [123456789012.dkr.ecr.us-east-1.amazonaws.com] }
      public: {}
  swarm:
    build: swarm
    privileged: true
    ports: ["127.0.0.1:${E2E_SSH_SWARM:-2224}:22"]
    networks: [public]
  k3s:
    image: rancher/k3s:v1.33.5-k3s1
    command: ["server", "--tls-san", "k3s", "--disable", "traefik", "--disable", "metrics-server", "--disable", "servicelb"]
    privileged: true
    tmpfs: ["/run", "/var/run"]
    networks: [private, public]  # k3s needs a default route; no port is published, so it is still reached through bastion
  sftp:
    image: atmoz/sftp:alpine
    command: ["deploy:deploypass:::uploads"]
    networks: [private]
  ftps:
    build: ftps
    networks: [private]
networks:
  public: {}
  private: { internal: true }
