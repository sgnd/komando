# Listen only on the container's own network (never on tun0), ask for the
# per-connection user and password, and only CONNECT out through the VPN.
logoutput: stderr
internal: eth0 port = 1080
external: tun0
clientmethod: none
socksmethod: username
user.privileged: root
user.unprivileged: nobody
client pass { from: 0.0.0.0/0 to: 0.0.0.0/0 }
socks pass { from: 0.0.0.0/0 to: 0.0.0.0/0 command: connect }
